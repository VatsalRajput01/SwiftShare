<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SwiftShare | Fast File Sharing</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>

<body>
  <nav>
    <div class="nav-left">
      <h1 class="logo">
        <span class="icon">⚡</span> Swift<span>Share</span>
      </h1>
    </div>
    <div class="nav-right">
      <div class="theme-toggle">
        <input type="checkbox" id="themeSwitch" />
        <label for="themeSwitch" class="toggle-label">
          <div class="ball"></div>
        </label>
      </div>
      <p id="themeText">Turn On Light Mode</p>
    </div>
  </nav>
  <main>
    <section class="hero">
      <div class="hero-content">
        <h1>Share Files Instantly & Securely</h1>
        <p>
          SwiftShare lets you upload, share, and download files in just one
          click. No account, no setup — pure speed and security.
        </p>
        <div class="btn-group">
          <a href="upload.html" class="btn primary-btn">
            <i class="fa-solid fa-upload"></i> Upload File
          </a>
          <a href="download.html" class="btn secondary-btn">
            <i class="fa-solid fa-download"></i> Download File
          </a>
        </div>
      </div>
    </section>
  </main>
  <footer>
    <div class="footer-links">
      <a href="howto.html">How to Use</a>
